name: mlops
channels:
  - conda-forge 
  - anaconda
  - defaults

dependencies:
  - python=3.12

  # --- Core científico / ML ---
  - numpy
  - pandas
  - polars
  - scikit-learn
  - xgboost
  - lightgbm
  - jupyterlab
  - matplotlib
  - pytest
  - catboost
  - seaborn
  - plotly
  - scipy
  - statsmodels
  - sympy
  - prophet
  - ipykernel
  - nb_conda_kernels

  # --- pip para el resto (más actualizado y con mejor soporte) ---
  - pip
  - pip:
      # Deep learning
      - torch
      - transformers
      - accelerate
      - sentence-transformers
      - diffusers
      - tensorflow

      # MLOps / experiment tracking / pipelines
      - mlflow
      - dvc
      - hydra-core
      - optuna
      - evidently
      - bentoml
      - prefect
      - great_expectations

      # RAG / LLM / Agentic AI
      - langchain
      - langgraph
      - llama-index
      - chromadb
      - qdrant-client
      - anthropic
      - openai
      - tiktoken
      - ragas
      - instructor

      # Utilidades
      - pydantic
      - fastapi
      - uvicorn
      - python-dotenv
      - ruff
      - beautifulsoup4
      - lxml
      - sqlalchemy
      - html5lib
      - openpyxl

